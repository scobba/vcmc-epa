<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Camp HOPE Clinical Team Debrief — VCMC Family Medicine Residency</title>
<style>
  :root {
    --navy: #1A2744;
    --navy-mid: #253660;
    --gold: #B8901E;
    --gold-pale: #FBF6E9;
    --gold-border: #E8D08A;
    --indigo: #333366;
    --sage: #6A8D76;
    --sage-pale: #EEF4F0;
    --slate: #4A5568;
    --slate-light: #8896A8;
    --border: #E2E6ED;
    --bg: #FFFFFF;
    --bg-soft: #F8F9FB;
    --white: #FFFFFF;
    --teal: #1A5C8A;
    --teal-pale: #EBF4FA;
    --adq-1: #9B1C1C;
    --adq-2: #C2410C;
    --adq-3: #A16207;
    --adq-4: #4D7C0F;
    --adq-5: #15803D;
    --scale-na: #6B7280;
    --warn: #C2410C;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    background: var(--white);
    color: var(--navy);
    min-height: 100vh;
    font-size: 15px;
    line-height: 1.6;
  }

  /* ── Header ── */
  .app-header {
    background: var(--white);
    padding: 0 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 68px;
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 1px solid var(--border);
  }
  .brand-lockup { display: flex; align-items: center; gap: 18px; }
  .app-header .logo {
    display: flex; align-items: center; gap: 14px;
    text-decoration: none; cursor: pointer;
  }
  .app-header .logo-icon { height: 40px; width: auto; display: block; flex-shrink: 0; }
  .logo-text { display: flex; flex-direction: column; gap: 2px; }
  .logo-text .line1, .logo-text .line2 {
    font-size: 10px; font-weight: 700; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--navy); line-height: 1.2;
  }
  .brand-divider { width: 1px; height: 34px; background: var(--border); flex-shrink: 0; }
  .hfj-logo { height: 38px; width: auto; display: block; flex-shrink: 0; transition: opacity 0.15s; }
  .hfj-logo:hover { opacity: 0.78; }
  .note-block a, .success-screen a {
    color: var(--teal); font-weight: 600; text-decoration: none;
    border-bottom: 1px solid rgba(26,92,138,0.35);
  }
  .note-block a:hover, .success-screen a:hover { border-bottom-color: var(--teal); }
  .nav-btn {
    background: transparent; border: none; border-bottom: 2px solid var(--navy);
    color: var(--navy); padding: 8px 16px;
    font-size: 10px; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase; font-family: inherit; height: 68px;
  }

  /* ── Layout ── */
  .form-container { max-width: 820px; margin: 0 auto; padding: 0 24px 80px; }

  .form-header {
    text-align: center; padding: 36px 0 28px;
    border-bottom: 1px solid var(--border); margin-bottom: 28px;
  }
  .form-header .eyebrow {
    font-size: 10px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--slate-light); margin-bottom: 10px;
  }
  .form-header h2 {
    font-size: 26px; font-weight: 300; color: var(--navy);
    margin-bottom: 10px; letter-spacing: -0.01em;
  }
  .form-header h2 strong { font-weight: 700; }
  .form-header .sub {
    font-size: 13px; color: var(--slate); max-width: 600px; margin: 0 auto 4px;
  }
  .intro-block {
    background: var(--bg-soft); border: 1px solid var(--border);
    border-left: 3px solid var(--gold);
    padding: 20px 24px; margin-bottom: 24px;
  }
  .intro-block p { font-size: 13.5px; color: var(--slate); line-height: 1.7; }
  .intro-block p + p { margin-top: 12px; }
  .anon-banner {
    display: inline-flex; align-items: center; gap: 8px; margin-top: 16px;
    background: var(--teal-pale); border: 1px solid #C7DEEC; color: var(--teal);
    padding: 9px 18px; font-size: 11px; font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase;
  }

  /* ── Sections ── */
  .section { margin-bottom: 8px; }
  .section-head {
    margin: 36px 0 14px; padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }
  .section-head .kicker {
    font-size: 10px; font-weight: 700; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--gold); margin-bottom: 5px;
  }
  .section-head h3 { font-size: 18px; font-weight: 600; color: var(--navy); }

  .note-block {
    background: var(--sage-pale); border: 1px solid #D3E2D8;
    border-left: 3px solid var(--sage);
    padding: 16px 20px; margin-bottom: 14px;
    font-size: 13px; color: var(--slate); line-height: 1.65;
  }

  /* ── Question card ── */
  .q-card {
    background: var(--white); border: 1px solid var(--border);
    border-left: 3px solid transparent;
    padding: 20px 22px; margin-bottom: 10px;
    transition: border-left-color 0.15s;
  }
  .q-card:focus-within { border-left-color: var(--navy); }
  .q-card.missing { border-left-color: var(--warn); }
  .q-head { display: flex; gap: 12px; margin-bottom: 14px; }
  .q-num {
    width: 22px; height: 22px; background: var(--navy); color: white;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 700; flex-shrink: 0; margin-top: 2px;
  }
  .q-text { font-size: 14px; font-weight: 600; color: var(--navy); line-height: 1.5; }
  .q-text .req { color: var(--warn); font-weight: 700; margin-left: 3px; }
  .q-hint {
    font-size: 12px; color: var(--slate-light); font-weight: 400;
    margin-top: 5px; line-height: 1.5;
  }
  .q-body { padding-left: 34px; }

  /* ── Choice rows ── */
  .choice-list { display: flex; flex-direction: column; gap: 6px; }
  .choice { position: relative; }
  .choice input { position: absolute; opacity: 0; width: 0; height: 0; }
  .choice label {
    display: flex; align-items: flex-start; gap: 11px;
    padding: 11px 14px; border: 1px solid var(--border);
    cursor: pointer; background: var(--white); transition: all 0.12s;
    font-size: 13.5px; line-height: 1.45; color: var(--navy);
  }
  .choice label:hover { border-color: var(--navy); background: var(--bg-soft); }
  .choice input:focus-visible + label { outline: 2px solid var(--navy); outline-offset: 1px; }
  .choice-mark {
    width: 15px; height: 15px; border: 1.5px solid var(--slate-light);
    flex-shrink: 0; margin-top: 2px; position: relative; background: var(--white);
  }
  .choice.radio .choice-mark { border-radius: 50%; }
  .choice input:checked + label { border-color: var(--navy); background: var(--bg-soft); font-weight: 600; }
  .choice input:checked + label .choice-mark { border-color: var(--navy); background: var(--navy); }
  .choice input:checked + label .choice-mark::after {
    content: ''; position: absolute; inset: 3px; background: var(--white);
  }
  .choice.radio input:checked + label .choice-mark::after { border-radius: 50%; }

  .cap-msg {
    margin-top: 9px; font-size: 12px; font-weight: 600; color: var(--warn);
  }

  .other-wrap { margin-top: 8px; padding-left: 26px; display: none; }
  .other-wrap.open { display: block; }
  .other-wrap input {
    width: 100%; border: 1px solid var(--border); padding: 9px 12px;
    font-size: 13.5px; font-family: inherit; color: var(--navy);
    outline: none; border-radius: 0; background: var(--white);
  }
  .other-wrap input:focus { border-color: var(--navy); }

  /* ── Likert ── */
  .likert-scale-key {
    display: flex; flex-wrap: wrap; gap: 6px 18px;
    font-size: 10px; font-weight: 700; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--slate-light);
    margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px dashed var(--border);
  }
  .likert-row { margin-bottom: 16px; }
  .likert-row:last-child { margin-bottom: 0; }
  .likert-stmt {
    font-size: 13.5px; color: var(--navy); line-height: 1.5;
    margin-bottom: 7px; display: flex; gap: 9px;
  }
  .likert-stmt .ltr {
    font-weight: 700; color: var(--gold); flex-shrink: 0; min-width: 14px;
  }
  .likert-opts { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; }
  .likert-opt { position: relative; }
  .likert-opt input { position: absolute; opacity: 0; width: 0; height: 0; }
  .likert-opt label {
    display: flex; align-items: center; justify-content: center; text-align: center;
    min-height: 46px; padding: 6px 3px; border: 1px solid var(--border);
    cursor: pointer; background: var(--white); transition: all 0.12s;
    font-size: 9.5px; font-weight: 700; letter-spacing: 0.02em;
    color: var(--slate); line-height: 1.25;
  }
  .likert-opt label:hover { border-color: var(--navy); background: var(--bg-soft); }
  .likert-opt input:focus-visible + label { outline: 2px solid var(--navy); outline-offset: 1px; }
  .likert-opt input:checked + label {
    background: var(--navy); border-color: var(--navy); color: var(--white);
  }
  .likert-opt[data-na="1"] input:checked + label { background: var(--scale-na); border-color: var(--scale-na); }
  /* graded fills used only where the scale has unambiguous valence */
  .likert-opts.graded .likert-opt[data-val="1"] input:checked + label { background: var(--adq-1); border-color: var(--adq-1); }
  .likert-opts.graded .likert-opt[data-val="2"] input:checked + label { background: var(--adq-2); border-color: var(--adq-2); }
  .likert-opts.graded .likert-opt[data-val="3"] input:checked + label { background: var(--adq-3); border-color: var(--adq-3); }
  .likert-opts.graded .likert-opt[data-val="4"] input:checked + label { background: var(--adq-4); border-color: var(--adq-4); }
  .likert-opts.graded .likert-opt[data-val="5"] input:checked + label { background: var(--adq-5); border-color: var(--adq-5); }

  /* ── Text ── */
  .text-input, .text-area {
    width: 100%; border: 1px solid var(--border); border-radius: 0;
    padding: 11px 13px; font-size: 13.5px; font-family: inherit;
    color: var(--navy); outline: none; background: var(--white);
  }
  .text-area { min-height: 110px; resize: vertical; }
  .text-input:focus, .text-area:focus { border-color: var(--navy); }

  /* ── Submit ── */
  .submit-bar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; margin-top: 28px; padding-top: 22px; border-top: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .progress-text { font-size: 12px; color: var(--slate-light); }
  .progress-text strong { color: var(--navy); }
  .btn {
    padding: 12px 30px; font-size: 10px; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase; cursor: pointer; border: none;
    transition: opacity 0.15s; font-family: inherit; border-radius: 0;
  }
  .btn-primary { background: var(--navy); color: white; }
  .btn-primary:hover { opacity: 0.88; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .warn-text { font-size: 12px; color: var(--warn); margin-top: 12px; width: 100%; text-align: right; }

  .success-screen { max-width: 460px; margin: 90px auto; padding: 0 24px; text-align: center; }
  .success-icon {
    width: 60px; height: 60px; background: var(--bg-soft); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; margin: 0 auto 24px; color: var(--sage);
  }
  .success-screen h2 { font-size: 22px; font-weight: 300; margin-bottom: 12px; color: var(--navy); }
  .success-screen h2 strong { font-weight: 700; }
  .success-screen p { color: var(--slate); font-size: 14px; line-height: 1.7; }

  .app-footer {
    background: var(--navy); color: rgba(255,255,255,0.45); text-align: center;
    padding: 28px 40px; font-size: 11px; line-height: 2;
    letter-spacing: 0.04em; margin-top: 60px;
  }
  .app-footer a { color: rgba(255,255,255,0.65); text-decoration: none; }
  .app-footer a:hover { color: white; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }

  @media (max-width: 700px) {
    .app-header { padding: 0 14px; height: auto; min-height: 58px; flex-wrap: wrap; gap: 8px; }
    .brand-lockup { gap: 11px; padding: 9px 0; }
    .app-header .logo-icon { height: 30px; }
    .hfj-logo { height: 27px; }
    .brand-divider { height: 26px; }
    .logo-text .line1, .logo-text .line2 { font-size: 7.5px; letter-spacing: 0.08em; }
    .nav-btn { display: none; }
    .form-container { padding: 0 14px 60px; }
    .q-card { padding: 16px 14px; }
    .q-body { padding-left: 0; }
    .q-head { margin-bottom: 12px; }
    .likert-opts { grid-template-columns: repeat(3, 1fr); }
    .likert-opt label { min-height: 40px; font-size: 9px; }
    .submit-bar { flex-direction: column; align-items: stretch; }
    .btn { width: 100%; }
    .warn-text { text-align: center; }
  }
</style>
</head>

// ══════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════
const answers = {};
let attemptedSubmit = false;

const esc = s => String(s).replace(/[&<>"']/g, m =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));

function roleGroup() {
  const r = answers['q1'];
  if (!r) return null;
  if (/^Faculty/i.test(r)) return 'faculty';
  if (/^Resident/i.test(r)) return 'resident';
  return 'other';
}

function visible(item) {
  const c = item.showIf;
  if (!c) return true;
  if (c.role) return roleGroup() === c.role;
  if (c.q) {
    const v = answers[c.q];
    if (v === undefined || v === null) return false;
    return c.in.includes(v);
  }
  return true;
}

function isAnswered(item) {
  const v = answers[item.id];
  if (item.type === 'likert') {
    return item.statements.every(s => answers[item.id + '_' + s.key] !== undefined);
  }
  if (item.type === 'multi') return Array.isArray(v) && v.length > 0;
  if (item.type === 'short' || item.type === 'long') return !!(v && v.trim());
  return v !== undefined && v !== null && v !== '';
}

function allItems() {
  const out = [];
  SURVEY.sections.forEach(sec => {
    if (!visible(sec)) return;
    sec.items.forEach(it => { if (it.type !== 'note' && visible(it)) out.push(it); });
  });
  return out;
}

function requiredMissing() {
  return allItems().filter(it => it.required && !isAnswered(it));
}

// ══════════════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════════════
function render() {
  const app = document.getElementById('app');
  const missingIds = attemptedSubmit ? new Set(requiredMissing().map(i => i.id)) : new Set();

  let html = `
    <div class="form-header">
      <div class="eyebrow">${esc(SURVEY.eyebrow)}</div>
      <h2>${SURVEY.titleHtml}</h2>
      <div class="sub">${esc(SURVEY.subtitle)}</div>
      <div class="anon-banner">${esc(SURVEY.banner)}</div>
    </div>
    <div class="intro-block">${SURVEY.intro.map(p => '<p>' + esc(p) + '</p>').join('')}</div>
  `;

  SURVEY.sections.forEach(sec => {
    if (!visible(sec)) return;
    html += '<div class="section">';
    html += `<div class="section-head"><div class="kicker">${esc(sec.kicker)}</div><h3>${esc(sec.title)}</h3></div>`;
    sec.items.forEach(item => {
      if (!visible(item)) return;
      html += item.type === 'note'
        ? `<div class="note-block">${item.html ? item.html : esc(item.text)}</div>`
        : renderQuestion(item, missingIds.has(item.id));
    });
    html += '</div>';
  });

  const missing = requiredMissing();
  const total = allItems().length;
  const done = allItems().filter(isAnswered).length;

  html += `
    <div class="submit-bar">
      <div class="progress-text"><strong>${done}</strong> of ${total} questions answered${missing.length ? ' &middot; ' + missing.length + ' required item' + (missing.length === 1 ? '' : 's') + ' remaining' : ''}</div>
      <button class="btn btn-primary" id="submit-btn" type="button">Submit response</button>
      <div class="warn-text" id="warn" style="display:none"></div>
    </div>
  `;

  app.innerHTML = html;
  bind();
}

function renderQuestion(item, isMissing) {
  const hint = item.hint ? `<div class="q-hint">${esc(item.hint)}</div>` : '';
  const req = item.required ? '<span class="req">*</span>' : '';
  let body = '';

  if (item.type === 'single' || item.type === 'multi') {
    const multi = item.type === 'multi';
    const cur = answers[item.id];
    body += '<div class="choice-list">';
    item.options.forEach((opt, i) => {
      const id = item.id + '_o' + i;
      const checked = multi ? (Array.isArray(cur) && cur.includes(opt)) : cur === opt;
      body += `
        <div class="choice ${multi ? 'check' : 'radio'}">
          <input type="${multi ? 'checkbox' : 'radio'}" id="${id}" name="${item.id}"
                 data-q="${item.id}" data-val="${esc(opt)}" ${checked ? 'checked' : ''}>
          <label for="${id}"><span class="choice-mark"></span><span>${esc(opt)}</span></label>
        </div>`;
    });
    if (item.other) {
      const id = item.id + '_other';
      const on = multi ? (Array.isArray(cur) && cur.includes('Other')) : cur === 'Other';
      body += `
        <div class="choice ${multi ? 'check' : 'radio'}">
          <input type="${multi ? 'checkbox' : 'radio'}" id="${id}" name="${item.id}"
                 data-q="${item.id}" data-val="Other" ${on ? 'checked' : ''}>
          <label for="${id}"><span class="choice-mark"></span><span>Other</span></label>
        </div>
        <div class="other-wrap ${on ? 'open' : ''}" id="${item.id}_otherwrap">
          <input type="text" placeholder="Please specify" data-othertext="${item.id}"
                 value="${esc(answers[item.id + '_other_text'] || '')}">
        </div>`;
    }
    body += '</div>';
  }

  if (item.type === 'likert') {
    const graded = item.graded ? ' graded' : '';
    body += '<div class="likert-scale-key">' +
      item.scale.map(s => `<span>${esc(s.l)}</span>`).join('') + '</div>';
    item.statements.forEach(st => {
      const key = item.id + '_' + st.key;
      body += `<div class="likert-row">
        <div class="likert-stmt"><span class="ltr">${esc(st.key)}.</span><span>${esc(st.text)}</span></div>
        <div class="likert-opts${graded}">`;
      item.scale.forEach(s => {
        const id = key + '_' + s.v;
        const checked = answers[key] === s.v;
        body += `
          <div class="likert-opt" data-val="${esc(s.v)}" ${s.v === 'na' ? 'data-na="1"' : ''}>
            <input type="radio" id="${id}" name="${key}" data-likert="${key}"
                   data-val="${esc(s.v)}" ${checked ? 'checked' : ''}>
            <label for="${id}">${esc(s.l)}</label>
          </div>`;
      });
      body += '</div></div>';
    });
  }

  if (item.type === 'short') {
    body += `<input type="text" class="text-input" data-text="${item.id}"
             value="${esc(answers[item.id] || '')}" placeholder="${esc(item.placeholder || '')}">`;
  }
  if (item.type === 'long') {
    body += `<textarea class="text-area" data-text="${item.id}"
             placeholder="${esc(item.placeholder || '')}">${esc(answers[item.id] || '')}</textarea>`;
  }

  return `
    <div class="q-card ${isMissing ? 'missing' : ''}" id="card_${item.id}">
      <div class="q-head">
        <div class="q-num">${item.num}</div>
        <div><div class="q-text">${esc(item.text)}${req}</div>${hint}</div>
      </div>
      <div class="q-body">${body}</div>
    </div>`;
}

// ══════════════════════════════════════════════════
// BINDINGS
// ══════════════════════════════════════════════════
function bind() {
  document.querySelectorAll('input[data-q]').forEach(el => {
    el.addEventListener('change', e => {
      const q = e.target.dataset.q, val = e.target.dataset.val;
      if (e.target.type === 'checkbox') {
        let cur = Array.isArray(answers[q]) ? answers[q].slice() : [];
        const i = cur.indexOf(val);
        if (e.target.checked) { if (i === -1) cur.push(val); }
        else if (i > -1) cur.splice(i, 1);

        const item = itemById(q);
        const excl = (item && item.exclusive) || [];
        if (e.target.checked && excl.includes(val)) {
          // "None of the above" clears everything else
          cur = [val];
        } else if (e.target.checked) {
          cur = cur.filter(v => !excl.includes(v));
        }
        const max = item && item.max;
        if (max && cur.length > max) {
          e.target.checked = false;
          flash(q, `You can select up to ${max}.`);
          return;
        }
        answers[q] = cur;
      } else {
        answers[q] = val;
      }
      render();
      focusBack(e.target.id);
    });
  });

  document.querySelectorAll('input[data-likert]').forEach(el => {
    el.addEventListener('change', e => {
      const raw = e.target.dataset.val;
      answers[e.target.dataset.likert] = raw === 'na' ? 'na' : Number(raw);
      render();
      focusBack(e.target.id);
    });
  });

  document.querySelectorAll('[data-text]').forEach(el => {
    el.addEventListener('input', e => { answers[e.target.dataset.text] = e.target.value; });
    el.addEventListener('blur', () => { if (attemptedSubmit) render(); });
  });

  document.querySelectorAll('[data-othertext]').forEach(el => {
    el.addEventListener('input', e => {
      answers[e.target.dataset.othertext + '_other_text'] = e.target.value;
    });
  });

  const btn = document.getElementById('submit-btn');
  if (btn) btn.addEventListener('click', submitForm);
}

function focusBack(id) {
  const el = document.getElementById(id);
  if (el) el.focus({ preventScroll: true });
}

function itemById(id) {
  for (const sec of SURVEY.sections) {
    for (const it of sec.items) if (it.id === id) return it;
  }
  return null;
}

function flash(qid, msg) {
  const card = document.getElementById('card_' + qid);
  if (!card) return;
  let el = card.querySelector('.cap-msg');
  if (!el) {
    el = document.createElement('div');
    el.className = 'cap-msg';
    card.querySelector('.q-body').appendChild(el);
  }
  el.textContent = msg;
  clearTimeout(el._t);
  el._t = setTimeout(() => { if (el.parentNode) el.remove(); }, 2600);
}

// ══════════════════════════════════════════════════
// SUBMIT
// ══════════════════════════════════════════════════
async function submitForm() {
  attemptedSubmit = true;
  const missing = requiredMissing();
  render();

  if (missing.length) {
    const warn = document.getElementById('warn');
    warn.style.display = 'block';
    warn.textContent = `Please answer the ${missing.length} required question${missing.length === 1 ? '' : 's'} marked in orange.`;
    const first = document.getElementById('card_' + missing[0].id);
    if (first && first.scrollIntoView) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = 'Submitting…';

  const payload = {
    survey: SURVEY.key,
    camp_year: CAMP_YEAR,
    role_group: SURVEY.key === 'clinical_team' ? roleGroup() : null,
    responses: buildResponses(),
    contact: null
  };

  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_ANON,
        'Authorization': `Bearer ${SUPABASE_ANON}`,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error('HTTP ' + res.status + ' — ' + (await res.text()));
    showSuccess();
  } catch (err) {
    console.error(err);
    btn.disabled = false;
    btn.textContent = 'Submit response';
    const warn = document.getElementById('warn');
    warn.style.display = 'block';
    warn.textContent = 'Your response did not save. Check your connection and press Submit again — nothing has been lost.';
  }
}

function buildResponses() {
  const out = {};
  SURVEY.sections.forEach(sec => {
    if (!visible(sec)) return;
    sec.items.forEach(item => {
      if (item.type === 'note' || !visible(item)) return;
      const rec = { num: item.num, question: item.text };
      if (item.type === 'likert') {
        rec.scale = item.scaleName;
        rec.statements = item.statements.map(s => ({
          key: s.key, text: s.text, value: answers[item.id + '_' + s.key] ?? null
        }));
      } else {
        rec.answer = answers[item.id] ?? null;
        if (item.other && answers[item.id + '_other_text']) {
          rec.other_text = answers[item.id + '_other_text'];
        }
      }
      out[item.id] = rec;
    });
  });
  return out;
}

function showSuccess() {
  document.getElementById('app').innerHTML = `
    <div class="success-screen">
      <div class="success-icon">&#10003;</div>
      <h2>Thank you &mdash; <strong>your response is recorded</strong></h2>
      <p>${SURVEY.successHtml}</p>
    </div>`;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

render();
</script>
